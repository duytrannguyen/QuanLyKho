services:
  db:
    image: mysql:8.0
    container_name: qkshop_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-dongduy122}
      MYSQL_DATABASE: ${DB_NAME:-qkshop_tonkho}
      TZ: Asia/Ho_Chi_Minh
    ports:
      # Cổng MySQL chỉ mở trên localhost của server để bảo mật
      - "127.0.0.1:${DB_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Tự động khởi tạo schema bảng và seed data ban đầu khi chạy lần đầu
      - ./database/init:/docker-entrypoint-initdb.d:ro
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci --default-time-zone='+07:00'

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qkshop_backend
    restart: always
    environment:
      - PORT=8080
      - DB_URL=jdbc:mysql://db:3306/${DB_NAME:-qkshop_tonkho}?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=UTF-8
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-dongduy122}
      - JWT_SECRET=${JWT_SECRET:-357638792F423F4428472B4B6250655368566D597133743677397A2443264629}
      - TZ=Asia/Ho_Chi_Minh
    ports:
      # Backend nội bộ, người dùng bên ngoài đi qua Nginx
      - "127.0.0.1:8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qkshop_frontend
    restart: always
    ports:
      # Lắng nghe trên IP tĩnh server: BIND_IP:HTTP_PORT
      - "${BIND_IP:-0.0.0.0}:${HTTP_PORT:-80}:80"
    depends_on:
      - backend

volumes:
  mysql_data:
