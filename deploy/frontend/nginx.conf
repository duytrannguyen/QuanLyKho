# Định nghĩa cụm Backend với kết nối Keepalive tái sử dụng TCP Socket
upstream backend_upstream {
    server backend:8080;
    keepalive 32;
}

server {
    listen 80 default_server;
    # "_" = chap nhan moi IP / ten mien tro ve server (truy cap bang IP tinh)
    server_name _;

    # Cho phép upload file Excel/ảnh lên đến 25MB (tránh lỗi 413 Payload Too Large)
    client_max_body_size 25M;

    # An bot thong tin phien ban Nginx
    server_tokens off;

    # Header bao mat co ban
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Bật nén Gzip để giảm dung lượng tải xuống và tăng tốc tải trang
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml font/woff2;
    gzip_min_length 256;

    root /usr/share/nginx/html;

    # Phục vụ giao diện React Single Page Application (SPA)
    location / {
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
    }

    # index.html KHONG cache -> nguoi dung luon nhan ban moi sau khi cap nhat
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Cấu hình Cache cho file tĩnh của Vite (nằm trong thư mục assets)
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        access_log off;
    }

    # Cache hình ảnh logo và icon tĩnh ở thư mục gốc để giảm tải mạng
    location ~* ^/[^/]+\.(png|jpg|jpeg|gif|ico|svg|webp|woff2)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
        access_log off;
    }

    # Cấu hình riêng cho luồng SSE thông báo thời gian thực (tắt buffering, giữ kết nối lâu)
    location /api/notifications/stream {
        proxy_pass http://backend_upstream/api/notifications/stream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Chuyển tiếp các request /api sang Backend Spring Boot
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_connect_timeout 60s;
        # Tang timeout cho cac tac vu nang (xuat/nhap Excel, bao cao)
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
        proxy_buffering on;
        proxy_buffers 16 16k;
        proxy_buffer_size 16k;
    }

    # Hỗ trợ xem tài liệu API Swagger / OpenAPI nếu cần
    location /swagger-ui/ {
        proxy_pass http://backend_upstream/swagger-ui/;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
    location /api-docs {
        proxy_pass http://backend_upstream/api-docs;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
    }
}
