
services:
  db:
    image: mysql:8.0
    container_name: qkshop_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-dongduy122}
      MYSQL_DATABASE: qkshop_tonkho
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: qkshop_backend
    restart: always
    environment:
      - PORT=8080
      - DB_URL=jdbc:mysql://db:3306/qkshop_tonkho?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true
      - DB_USERNAME=root
      - DB_PASSWORD=${DB_PASSWORD:-dongduy122}
      - JWT_SECRET=${JWT_SECRET:-QKShopTonKhoV2SecretKeyForJWTTokenGeneration2024VeryLongSecureKey!!}
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: qkshop_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data:
